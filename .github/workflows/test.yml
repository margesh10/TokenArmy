name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Fixture benchmark is reproducible and matches the published numbers
        shell: bash
        run: |
          node bench/run.js
          git diff --exit-code -- bench/results.json bench/out || { echo "::error::Benchmark output changed. Run 'npm run bench' and commit the results (and update README numbers)."; exit 1; }
      - name: CLI smoke test
        shell: bash
        run: |
          node bin/tokenarmy.js version
          printf 'line\n%.0s' $(seq 1 400) | node bin/tokenarmy.js squeeze --cmd "npm test" > /dev/null
          tmp=$(mktemp -d) && (cd "$tmp" && node "$GITHUB_WORKSPACE/bin/tokenarmy.js" init --agent all > /dev/null && test -f .claude/settings.json && test -f .github/hooks/tokenarmy.json && test -f .devin/hooks.v1.json)
